<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/eccuity-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#ffffff" />
    <title>CoT Report Dashboard</title>
    <!-- Apply the persisted/preferred theme before paint to avoid a flash of the wrong theme. -->
    <script>
      (function () {
        try {
          var key = 'cot-theme';
          var stored = localStorage.getItem(key);
          // Default to light; honor an explicit stored choice only.
          var theme = (stored === 'light' || stored === 'dark') ? stored : 'light';
          if (theme === 'dark') document.documentElement.classList.add('dark');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#1a1a1a' : '#ffffff');
        } catch (e) { /* no-op */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
